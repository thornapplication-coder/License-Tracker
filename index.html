/* ---------- version comparison (old file vs. currently loaded data) ---------- */
function normName(s){ return String(s).toLowerCase().replace(/\s+/g, " ").trim(); }
function personMapFor(sh){
  const nk = nameColKeysFor(sh);
  const map = new Map();
  const dups = new Set();      // names that occur more than once — only the first row is compared
  sh.rows.forEach((row) => {
    const nm = nk.map(k => String(row.c[k] || "").trim()).filter(Boolean).join(" ");
    if (!nm) return;
    const key = normName(nm);
    if (map.has(key)) dups.add(nm); else map.set(key, { row, name: nm });
  });
  return { map, dups };
}
function compareSheets(oldSheets){
  const diffs = [];   // {kind, tab, person, col, oldV, newV, tag}
  const dupNames = new Set();
  const oldByName = new Map(oldSheets.map(s => [s.name, s]));
  const newNames = new Set(state.sheets.map(s => s.name));
  const onlyTabs = oldSheets.filter(s => !newNames.has(s.name)).map(s => s.name)
    .concat(state.sheets.filter(s => !oldByName.has(s.name)).map(s => s.name));
  for (const shNew of state.sheets){
    const shOld = oldByName.get(shNew.name);
    if (!shOld) continue;
    const pNewMap = personMapFor(shNew), pOldMap = personMapFor(shOld);
    const mNew = pNewMap.map, mOld = pOldMap.map;
    pNewMap.dups.forEach(n => dupNames.add(n));
    pOldMap.dups.forEach(n => dupNames.add(n));
    for (const [key, p] of mNew) if (!mOld.has(key))
      diffs.push({ kind: "added", tab: shNew.name, person: p.name, col: "", oldV: "", newV: "", tag: "" });
    for (const [key, p] of mOld) if (!mNew.has(key))
      diffs.push({ kind: "removed", tab: shNew.name, person: p.name, col: "", oldV: "", newV: "", tag: "" });
    /* date columns matched by label */
    const colsNew = new Map(shNew.columns.filter(c => c.type === "date").map(c => [c.label, c.key]));
    const colsOld = new Map(shOld.columns.filter(c => c.type === "date").map(c => [c.label, c.key]));
    for (const [key, pNew] of mNew){
      const pOld = mOld.get(key);
      if (!pOld) continue;
      for (const [label, kNew] of colsNew){
        const kOld = colsOld.get(label);
        if (!kOld) continue;
        const isoNew = parseDateString(pNew.row.c[kNew]);
        const isoOld = parseDateString(pOld.row.c[kOld]);
        if (isoNew === isoOld) continue;
        const tag = !isoOld ? t("cmpNewVal") : !isoNew ? t("cmpGoneVal")
                  : (isoNew > isoOld ? t("cmpExt") : t("cmpShort"));
        diffs.push({ kind: "changed", tab: shNew.name, person: pNew.name, col: label,
          oldV: isoOld ? fmtDate(isoOld) : "—", newV: isoNew ? fmtDate(isoNew) : "—", tag });
      }
    }
  }
  return { diffs, onlyTabs, dupNames: [...dupNames] };
}
function handleCompareFile(file){
  const reader = new FileReader();
  reader.onerror = () => toast(t("importErr", {e: "FileReader"}), "err");
  reader.onload = (ev) => {
    const bytes = new Uint8Array(ev.target.result);
    const runCompare = (u8) => {
      const oldSheets = parseWorkbookBytes(u8);
      if (!oldSheets.length){ toast(t("importEmpty"), "warn"); return; }
      openCompareResult(compareSheets(oldSheets), file.name);
    };
    try {
      runCompare(bytes);
    } catch(e){
      console.error(e);
      if (/password/i.test(e && e.message ? e.message : "")){
        openPasswordModal(bytes, file.name, (u8) => {
          try { runCompare(u8); }
          catch(e2){ console.error(e2); toast(t("importErr", {e: e2 && e2.message ? e2.message : e2}), "err", 8000); }
        });
      } else {
        toast(t("importErr", {e: e && e.message ? e.message : e}), "err", 8000);
      }
    }
  };
  reader.readAsArrayBuffer(file);
}
function openCompare(){
  if (!state.sheets.length){ toast(t("printHint"), "warn"); return; }
  openModal({
    title: t("cmpTitle"),
    bodyHTML: "<p>" + esc(t("cmpBody")) + "</p>",

function openCompareResult(result, fileName){
  const { diffs, onlyTabs, dupNames } = result;
  const groups = [
    ["added", t("cmpAdded")],
    ["removed", t("cmpRemoved")],
    ["changed", t("cmpChanged")]
  ];
  let body = "<p><strong>" + esc(fileName) + "</strong> → " + esc(t("footAsOf", {t: fmtNow()})) + "</p>";
  if (onlyTabs.length) body += "<p>⚠ " + esc(t("cmpOnlyTabs", {t: onlyTabs.join(", ")})) + "</p>";
  if (dupNames && dupNames.length)
    body += "<p>⚠ " + esc(t("cmpDups", {n: dupNames.slice(0, 10).join(", ") + (dupNames.length > 10 ? " …" : "")})) + "</p>";
  if (!diffs.length){
    body += "<p>✅ " + esc(t("cmpNone")) + "</p>";
  } else {
    for (const [kind, title] of groups){
      const list = diffs.filter(d => d.kind === kind);
      if (!list.length) continue;
      body += '<div class="dq-sec"><h4>' + esc(title) + " — " + esc(t("dqHits", {n: list.length})) + "</h4>" +
        '<ul class="dq-list">' +
        list.slice(0, 80).map(d =>
          "<li><span class='t'>" + esc(d.tab) + "</span><b>" + esc(d.person) + "</b>" +
          (d.col ? "<span>" + esc(d.col) + "</span>" : "") +
          (d.kind === "changed" ? "<span>" + esc(d.oldV) + " → " + esc(d.newV) + "</span><span class='t'>" + esc(d.tag) + "</span>" : "") +
          "</li>").join("") +
        (list.length > 80 ? "<li>… +" + (list.length - 80) + "</li>" : "") +
        "</ul></div>";
    }
  }
  const kindLabel = { added: t("cmpAdded"), removed: t("cmpRemoved"), changed: t("cmpChanged") };
  openModal({
    title: t("cmpResTitle"),
    bodyHTML: body,
    buttons: [
      { label: t("close"), kind: "ghost", onClick: () => true },
      { label: t("cmpExport"), onClick: () => {
          const lines = [t("cmpCsvHead")]
            .concat(diffs.map(d => [kindLabel[d.kind], d.tab, d.person, d.col, d.oldV, d.newV, d.tag].map(csvEscape).join(";")));
          downloadCSV(lines, "versionsvergleich-" + exportStamp() + ".csv");
          toast(t("backupDone"));
          return true;
      }}
    ]
  });
}

  state.settings.lastVersion = APP_VERSION;
  saveState();
}
</script>
