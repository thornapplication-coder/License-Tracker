<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>Instructor Overview – Dashboard</title>
<style>
  :root{
    /* Blue → dark-blue brand palette */
    --bl:#2160ae;          /* primary blue */
    --bl-dark:#173f77;     /* dark blue */
    --bl-deep:#0f2c56;     /* deepest blue */
    --bl-accent:#3d7fd4;   /* lighter accent */
    --bl-soft:#e8f0fa;     /* soft blue tint */
    --ink:#1c2534; --ink-2:#4a5568; --ink-3:#7b8794;
    --paper:#f4f7fb; --card:#ffffff; --line:#d9e2ee;
    /* Status palette — fixed, always paired with icon + label */
    --st-ok:#0ca30c;      --st-ok-text:#086108;      --st-ok-bg:#e7f6e7;
    --st-warn:#fab219;    --st-warn-text:#7a5200;    --st-warn-bg:#fdf3d9;
    --st-serious:#ec835a; --st-serious-text:#993a17; --st-serious-bg:#fdeae2;
    --st-crit:#d03b3b;    --st-crit-text:#8f1f1f;    --st-crit-bg:#fbe3e3;
    --st-none:#7b8794;    --st-none-text:#4a5568;    --st-none-bg:#eef1f5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:Arial,"Helvetica Neue",Helvetica,"Liberation Sans","Segoe UI",system-ui,sans-serif;
       background:var(--paper);color:var(--ink);font-size:14.5px;line-height:1.45}
  input,select,textarea,button{font-family:inherit;font-size:inherit}
  button{cursor:pointer}

  header{background:linear-gradient(110deg,var(--bl),var(--bl-dark) 60%,var(--bl-deep));color:#fff;
         padding:16px 22px 14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .logo{width:46px;height:46px;border-radius:8px;background:#fff;color:var(--bl-dark);display:flex;
        align-items:center;justify-content:center;font-weight:800;font-size:19px;flex:0 0 auto;letter-spacing:.5px}
  header .titles{flex:1 1 260px;min-width:220px}
  header h1{font-size:19px;font-weight:800;letter-spacing:.2px}
  header .sub{font-size:12.5px;opacity:.85;margin-top:2px}
  .hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge{font-size:12px;padding:4px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.45);
         background:rgba(255,255,255,.12);display:inline-flex;align-items:center;gap:6px}
  .lang-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);color:#fff;
            border-radius:6px;padding:5px 11px;font-weight:700;font-size:12.5px}
  .lang-btn:hover{background:rgba(255,255,255,.26)}
  .lang-group{display:inline-flex;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.45)}
  .lang-group .lang-btn{border:none;border-radius:0}
  .lang-group .lang-btn[aria-pressed="true"]{background:#fff;color:var(--bl-dark)}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 22px;background:var(--card);
           border-bottom:1px solid var(--line);align-items:center}
  .btn{padding:8px 14px;border:1px solid var(--bl);background:var(--bl);color:#fff;border-radius:6px;
       font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:background .12s}
  .btn:hover{background:var(--bl-dark);border-color:var(--bl-dark)}
  .btn.ghost{background:#fff;color:var(--bl);border-color:var(--bl)}
  .btn.ghost:hover{background:var(--bl-soft)}
  .btn.danger{background:#fff;color:var(--st-crit-text);border-color:var(--st-crit)}
  .btn.danger:hover{background:var(--st-crit-bg)}
  .btn:focus-visible,.lang-btn:focus-visible,input:focus-visible,select:focus-visible{
       outline:3px solid var(--bl-accent);outline-offset:1px}
  .toolbar .spacer{flex:1 1 auto}
  .toolbar .tb-sep{width:1px;align-self:stretch;min-height:24px;background:var(--line);margin:2px 3px}

  /* ---- sheet tabs ---- */
  .sheet-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;border-bottom:2px solid var(--line);padding-bottom:0}
  .sheet-tab{border:1px solid var(--line);border-bottom:none;background:#eef3f9;color:var(--ink-2);
             padding:8px 14px;border-radius:6px 6px 0 0;font-weight:700;font-size:13px;position:relative;top:2px}
  .sheet-tab:hover{background:var(--bl-soft);color:var(--bl-dark)}
  .sheet-tab.active{background:var(--bl-dark);border-color:var(--bl-dark);color:#fff}
  .sheet-tab .n{font-weight:400;opacity:.8;font-size:11.5px;margin-left:5px}

  main{padding:18px 22px 40px;max-width:1500px;margin:0 auto}

  /* ---- upload page / drop zone ---- */
  .upload-page{max-width:860px;margin:10px auto 0}
  .upload-page .up-back{margin-bottom:14px}
  .dropzone{border:3px dashed var(--bl-accent);border-radius:11px;background:var(--card);
            padding:84px 34px;text-align:center;transition:background .15s,border-color .15s;cursor:pointer}
  .dropzone.drag{background:var(--bl-soft);border-color:var(--bl-dark)}
  .dropzone .dz-icon{font-size:64px;margin-bottom:14px}
  .dropzone h2{font-size:26px;color:var(--bl-dark);margin-bottom:12px}
  .dropzone p{color:var(--ink-2);margin-bottom:8px;font-size:15px;max-width:620px;margin-left:auto;margin-right:auto}
  .dropzone .dz-actions{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .dropzone .dz-actions .btn{font-size:15px;padding:12px 22px}

  /* ---- row delete ---- */
  td.delcell,th.delcell{width:34px;text-align:center;padding:4px 4px !important}
  th.delcell{cursor:default !important}
  .rowdel{background:transparent;border:none;font-size:15px;padding:3px 6px;border-radius:5px;opacity:.45}
  .rowdel:hover{opacity:1;background:var(--st-crit-bg)}

  /* ---- export modal options ---- */
  .exp-btn{display:flex;align-items:center;gap:13px;width:100%;text-align:left;margin:8px 0;
           padding:13px 15px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
  .exp-btn:hover{border-color:var(--bl);background:var(--bl-soft)}
  .exp-btn .ic{font-size:25px;flex:0 0 auto}
  .exp-btn .tt{font-weight:800;color:var(--bl-dark)}
  .exp-btn .ss{font-size:12px;color:var(--ink-2);margin-top:2px}

  /* ---- reference date bar ---- */
  .refdate{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;background:linear-gradient(110deg,var(--bl-soft),#f3f8ff);
           border:1px solid var(--bl-accent);border-left:5px solid var(--bl);border-radius:8px;
           padding:10px 16px;margin-bottom:14px;font-size:13.5px;color:var(--ink-2)}
  .refdate .rd-label{font-weight:800;color:var(--bl-dark);text-transform:uppercase;font-size:12px;letter-spacing:.4px}
  .refdate .rd-date{font-weight:800;color:var(--bl-deep);font-size:15.5px}
  .refdate .rd-sub{font-size:12px;color:var(--ink-3)}

  /* ---- KPI tiles ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:13px 15px;position:relative}
  .kpi .k-label{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px;
                display:flex;align-items:center;gap:6px}
  .kpi .k-val{font-size:29px;font-weight:800;margin-top:4px;color:var(--ink);font-variant-numeric:tabular-nums}
  .kpi .k-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
  .kpi.accent{background:linear-gradient(135deg,var(--bl),var(--bl-dark));border-color:var(--bl-dark)}
  .kpi.accent .k-label,.kpi.accent .k-val,.kpi.accent .k-sub{color:#fff}
  .kpi.accent .k-sub{opacity:.8}
  .kpi[data-st]{border-left:5px solid var(--st-none)}
  .kpi[data-st="expired"]{border-left-color:var(--st-crit)}
  .kpi[data-st="critical"]{border-left-color:var(--st-serious)}
  .kpi[data-st="warning"]{border-left-color:var(--st-warn)}
  .kpi[data-st="ok"]{border-left-color:var(--st-ok)}
  .kpi.clickable{cursor:pointer}
  .kpi.clickable:hover{border-color:var(--bl-accent);box-shadow:0 2px 8px rgba(15,44,86,.10)}

  /* ---- cards ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;margin-bottom:16px;overflow:hidden}
  .card > h3{font-size:14px;font-weight:800;color:var(--bl-dark);padding:12px 16px;border-bottom:1px solid var(--line);
             display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#fbfdff,#f3f7fc)}
  .card > h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--bl);flex:0 0 auto}
  .card .card-body{padding:14px 16px}

  /* ---- warnings ---- */
  .warn-list{list-style:none;max-height:340px;overflow:auto}
  .warn-list li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 16px;
                border-bottom:1px solid var(--line);font-size:13.5px}
  .warn-list li:last-child{border-bottom:none}
  .warn-list .w-name{font-weight:700;min-width:160px}
  .warn-list .w-lic{color:var(--ink-2);min-width:140px}
  .warn-list .w-date{font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .warn-list .w-days{font-size:12px;color:var(--ink-3)}
  .warn-empty{padding:16px;color:var(--ink-2);font-size:13.5px;display:flex;align-items:center;gap:8px}
  .warn-more{padding:9px 16px;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line)}

  /* ---- status quick-filter bar (multi-select) ---- */
  .statusbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .statusbar .sb-label{font-size:12.5px;font-weight:800;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px}
  .stchip{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:7px;font-size:13px;
          font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink-2);transition:all .12s}
  .stchip .cnt{font-variant-numeric:tabular-nums;background:var(--st-none-bg);border-radius:7px;
               padding:1px 8px;font-size:11.5px}
  .stchip:hover{border-color:var(--bl-accent)}
  .stchip[aria-pressed="true"]{color:#fff;border-width:1.5px}
  .stchip[data-st="expired"][aria-pressed="true"]{background:var(--st-crit);border-color:var(--st-crit)}
  .stchip[data-st="critical"][aria-pressed="true"]{background:var(--st-serious);border-color:var(--st-serious)}
  .stchip[data-st="warning"][aria-pressed="true"]{background:var(--st-warn);border-color:var(--st-warn);color:#5b3d00}
  .stchip[data-st="ok"][aria-pressed="true"]{background:var(--st-ok);border-color:var(--st-ok)}
  .stchip[data-st="none"][aria-pressed="true"]{background:var(--st-none);border-color:var(--st-none)}
  .stchip[aria-pressed="true"] .cnt{background:rgba(255,255,255,.28);color:inherit}

  /* ---- active-only toggle (in the quick-filter bar) ---- */
  .sb-active{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:7px;font-size:13px;
             font-weight:700;border:1.5px dashed var(--bl);background:#fff;color:var(--bl-dark);transition:all .12s}
  .sb-active:hover{background:var(--bl-soft)}
  .sb-active[aria-pressed="true"]{background:var(--bl);border-style:solid;color:#fff}
  .sb-active .cnt{font-variant-numeric:tabular-nums;background:var(--bl-soft);color:var(--bl-dark);
                  border-radius:7px;padding:1px 8px;font-size:11.5px}
  .sb-active[aria-pressed="true"] .cnt{background:rgba(255,255,255,.28);color:#fff}
  .sb-hideold{border-color:var(--st-serious);color:var(--st-serious)}
  .sb-hideold:hover{background:var(--st-warn-bg)}
  .sb-hideold[aria-pressed="true"]{background:var(--st-serious);border-color:var(--st-serious);color:#fff}
  .sb-hideold .cnt{background:var(--st-warn-bg);color:var(--st-serious)}
  .sb-hideold[aria-pressed="true"] .cnt{background:rgba(255,255,255,.28);color:#fff}

  /* ---- sticky lead columns (delete/status/name) ---- */
  table.data td.stick{position:sticky;z-index:1;background:var(--card);white-space:nowrap;
                      overflow:hidden;text-overflow:ellipsis}
  table.data tbody tr:nth-child(even) td.stick{background:#f7fafd}
  table.data tbody tr:hover td.stick{background:var(--bl-soft)}
  table.data thead th.stick{z-index:5}

  /* ---- person link + detail modal ---- */
  .plink{background:none;border:none;padding:0;color:var(--bl-dark);font-weight:700;font-size:inherit;
         text-decoration:underline;text-decoration-color:var(--bl-accent);cursor:pointer;text-align:left}
  .plink:hover{color:var(--bl)}
  .pd-list{list-style:none;margin:6px 0 4px}
  .pd-list li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
  .pd-list li:last-child{border-bottom:none}
  .pd-list .pd-lic{flex:1 1 200px;font-weight:600}
  .pd-list .pd-date{font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .pd-list .pd-days{font-size:12px;color:var(--ink-3)}
  .pd-other{margin-top:6px;font-size:13px}
  .pd-other div{padding:4px 0;border-bottom:1px dashed var(--line)}
  .pd-other b{color:var(--ink-2);font-weight:700;margin-right:6px}
  .modal h4{font-size:13px;color:var(--bl-dark);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.4px}

  /* ---- data quality report ---- */
  .dq-sec{margin:10px 0}
  .dq-sec h4{margin-top:4px}
  .dq-list{list-style:none;font-size:12.5px;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:6px}
  .dq-list li{padding:5px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
  .dq-list li:last-child{border-bottom:none}
  .dq-list .t{color:var(--ink-3);min-width:130px}

  /* ---- export status checkboxes ---- */
  .exp-status{display:flex;flex-wrap:wrap;gap:7px 14px;margin:6px 0 12px;padding:11px 13px;
              background:var(--bl-soft);border-radius:7px}
  .exp-status label{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
                    margin:0;cursor:pointer;color:var(--ink)}
  .exp-count{font-size:12.5px;color:var(--ink-2);margin-bottom:10px;font-variant-numeric:tabular-nums}

  /* ---- month calendar ---- */
  .cal-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
  .cal-head .cal-month{font-weight:800;color:var(--bl-dark);font-size:15px;min-width:170px;text-align:center}
  .cal-head .btn{padding:5px 11px}
  .cal-head .spacer{flex:1 1 auto}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px 16px 16px}
  .cal-wd{font-size:11px;font-weight:800;color:var(--ink-3);text-transform:uppercase;text-align:center;padding:2px 0}
  .cal-day{min-height:62px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;
           background:#fff;position:relative;text-align:left;vertical-align:top}
  .cal-day.empty{border:none;background:transparent}
  .cal-day .dnum{font-weight:700;color:var(--ink-2)}
  .cal-day.today{border:2px solid var(--bl);background:var(--bl-soft)}
  .cal-day.has{cursor:pointer}
  .cal-day.has:hover{border-color:var(--bl-accent);box-shadow:0 2px 6px rgba(15,44,86,.12)}
  .cal-names{display:flex;flex-direction:column;gap:1px;margin-top:3px}
  .cal-name{position:relative;padding-left:11px;font-size:10px;line-height:1.35;font-weight:600;color:var(--ink);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-name::before{content:"●";position:absolute;left:0;top:0;font-size:8px;line-height:1.7}
  .cal-name.expired::before{color:var(--st-crit)}
  .cal-name.critical::before{color:var(--st-serious)}
  .cal-more{font-size:9.5px;font-weight:700;color:var(--ink-3);padding-left:11px}

  /* ---- status chips: color + icon + text, never color alone ---- */
  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:7px;font-size:11.5px;
        font-weight:700;white-space:nowrap;border:1px solid transparent}
  .chip.expired {background:var(--st-crit-bg);   color:var(--st-crit-text);   border-color:var(--st-crit)}
  .chip.critical{background:var(--st-serious-bg);color:var(--st-serious-text);border-color:var(--st-serious)}
  .chip.warning {background:var(--st-warn-bg);   color:var(--st-warn-text);   border-color:var(--st-warn)}
  .chip.ok      {background:var(--st-ok-bg);     color:var(--st-ok-text);     border-color:var(--st-ok)}
  .chip.none    {background:var(--st-none-bg);   color:var(--st-none-text);   border-color:var(--st-none)}

  /* ---- filters ---- */
  .filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
  .filters label{font-size:12px;font-weight:700;color:var(--ink-2)}
  .filters input[type=search],.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;
        background:#fff;color:var(--ink);min-width:120px;max-width:230px}
  .filters input[type=search]{min-width:200px;flex:0 1 260px}
  .filters .count{margin-left:auto;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}

  /* ---- table ---- */
  .table-wrap{overflow:auto;max-height:70vh}
  table.data{border-collapse:collapse;width:100%;min-width:720px}
  table.data thead th{position:sticky;top:0;z-index:2;background:var(--bl-dark);color:#fff;text-align:left;
        padding:9px 10px;font-size:12px;letter-spacing:.3px;white-space:nowrap;cursor:pointer;user-select:none}
  table.data thead th:hover{background:var(--bl)}
  table.data thead th .arrow{font-size:10px;opacity:.9;margin-left:4px}
  table.data tbody td{padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  table.data tbody tr:nth-child(even){background:#f7fafd}
  table.data tbody tr:hover{background:var(--bl-soft)}
  td.date-cell{white-space:nowrap;font-variant-numeric:tabular-nums}
  td.date-cell .d{display:block;margin-bottom:2px}
  td.date-old{text-align:center;color:var(--ink-2);opacity:.5}
  td.date-old .d-old{font-size:16px;letter-spacing:2px}
  .no-rows{padding:22px 16px;color:var(--ink-2)}

  footer{padding:14px 22px 30px;color:var(--ink-3);font-size:12px;max-width:1500px;margin:0 auto}
  footer .meta{margin-top:3px}

  /* ---- toast ---- */
  #toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:600;max-width:380px}
  .toast{background:var(--bl-deep);color:#fff;padding:11px 16px;border-radius:7px;font-size:13.5px;
         box-shadow:0 6px 22px rgba(15,44,86,.35);display:flex;gap:9px;align-items:center;
         animation:tin .18s ease-out}
  .toast .t-act{background:#fff;color:var(--bl-dark);border:none;border-radius:5px;padding:5px 12px;
                font-weight:800;font-size:12.5px;flex:0 0 auto}
  .toast .t-act:hover{background:var(--bl-soft)}
  .toast.err{background:#8f1f1f}
  .toast.warn{background:#7a5200}
  @keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

  /* ---- modal ---- */
  .modal-back{position:fixed;inset:0;background:rgba(15,26,46,.55);display:flex;align-items:center;
              justify-content:center;z-index:500;padding:18px}
  .modal{background:#fff;border-radius:9px;max-width:560px;width:100%;max-height:88vh;display:flex;
         flex-direction:column;box-shadow:0 18px 60px rgba(9,20,40,.45)}
  .modal header{background:linear-gradient(110deg,var(--bl),var(--bl-dark));border-radius:9px 9px 0 0;
                padding:13px 18px;display:flex;align-items:center;gap:10px}
  .modal header h2{font-size:15.5px;color:#fff;flex:1}
  .modal .x{background:transparent;border:none;color:#fff;font-size:19px;line-height:1;padding:4px 8px;border-radius:5px}
  .modal .x:hover{background:rgba(255,255,255,.18)}
  .modal .m-body{padding:16px 18px;overflow:auto;font-size:13.5px}
  .modal .m-body p{margin-bottom:10px}
  .modal .m-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
  .modal label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:10px 0 4px}
  .modal input[type=text],.modal input[type=number],.modal select{width:100%;padding:8px 10px;
        border:1px solid var(--line);border-radius:6px}
  .set-sep{border:none;border-top:1px solid var(--line);margin:16px 0 12px}
  .set-h{font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:4px}
  .set-sub{font-size:12.5px;color:var(--ink-2)}
  .set-backup{display:flex;flex-wrap:wrap;gap:9px}

function t(key, vars){
  let s = (I18N[state.settings.lang] && I18N[state.settings.lang][key]) || I18N.de[key] || key;
  if (vars) for (const k in vars) s = s.split("{"+k+"}").join(String(vars[k]));
  return s;
}

/* ---------- security: escape ALL of & < > " ' ---------- */
function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ---------- shared helpers (single source of truth) ---------- */
const pad2 = (n) => String(n).padStart(2, "0");
/* "looks like a d.m.y date" — shared by parser, cell renderer and quality report */
const DATE_LIKE_RE = /^\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4}$/;
function isDateLike(v){ return DATE_LIKE_RE.test(String(v == null ? "" : v).trim()); }
function locale(){ return state.settings.lang === "de" ? "de-DE" : "en-GB"; }
/* Intl formatters are expensive to construct — cache per language */
const fmtCache = {};
function cachedFmt(kind, opts){
  const key = locale() + "|" + kind;
  if (!fmtCache[key]){
    try { fmtCache[key] = new Intl.DateTimeFormat(locale(), opts); }
    catch(e){ console.error(e); fmtCache[key] = null; }
  }
  return fmtCache[key];
}
/* CSV: quote + neutralize leading formula characters (CSV injection) */
function csvEscape(v){
  let s = String(v == null ? "" : v);
  if (/^[=+\-@\t]/.test(s) && !/^[-+]?\d+([.,]\d+)?$/.test(s)) s = "'" + s;
  return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCSV(lines, name){
  downloadBlob(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }), name);
}
/* "expires in X days" text — shared by table, alerts, PDF, mail, person view */
function daysText(days){
  return days < 0 ? t("daysAgo", {d: -days}) : days === 0 ? t("daysToday") : t("daysIn", {d: days});
}
/* collect license items (name/lic/iso/days/status) from rows, filtered by status set,
   sorted by expiry — shared by PDF, ICS and mail exports */
function collectItems(rows, wanted){
  const perLic = { expired: 0, critical: 0, warning: 0, ok: 0 };
  const items = [];
  for (const { row, idx, ev } of rows){
    for (const it of ev.items){
      if (!it.iso) continue;
      perLic[it.status]++;
      if (wanted.includes(it.status))
        items.push({ name: rowName(row, idx), lic: it.col.label, iso: it.iso, days: it.days, status: it.status });
    }
  }
  items.sort((a, b) => a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : 0);
  return { items, perLic };
}

/* ---------- storage: SETTINGS ONLY — license data is never persisted ---------- */
function loadState(){
  try {
    /* wipe any data stored by older versions of this app */
    const legacy = localStorage.getItem(LS_LEGACY_KEY);
    if (legacy){
      try {
        const old = JSON.parse(legacy);
        if (old && typeof old.settings === "object" && !localStorage.getItem(LS_SETTINGS_KEY))
          localStorage.setItem(LS_SETTINGS_KEY, JSON.stringify(old.settings));
      } catch(e){ console.error("legacy settings unreadable", e); }
      localStorage.removeItem(LS_LEGACY_KEY);
    }
    const raw = localStorage.getItem(LS_SETTINGS_KEY);
    if (raw){
      const s = sanitizeState({ settings: JSON.parse(raw) });   // reuse whitelist/coerce path
      state.settings = s.settings;
    }
  } catch(e){ console.error("settings read failed", e); }
}
function saveState(){
  /* data stays in memory only; persist just the settings */
  try {
    localStorage.setItem(LS_SETTINGS_KEY, JSON.stringify(state.settings));
    return true;
  } catch(e){
    console.error("settings write failed", e);
    toast(t("saveErr"), "err");        // honest feedback — never swallow storage failures
    return false;
  }
}

/* ---------- schema validation (whitelist + coerce + cap) ---------- */
function capStr(v, max){ const s = String(v == null ? "" : v); return s.length > max ? s.slice(0, max) : s; }
function coerceInt(v, def, min, max){
  const n = Math.round(Number(v));
  if (!isFinite(n)) return def;
  return Math.min(max, Math.max(min, n));
}
function sanitizeSheet(sh){
  if (typeof sh !== "object" || sh === null) return null;
  const cols = Array.isArray(sh.columns) ? sh.columns.slice(0, LIMITS.cols) : [];
  const keySet = new Set();
  const outCols = [];
  for (const c of cols){
    if (typeof c !== "object" || c === null) continue;
    const key = capStr(c.key, 24);
    if (!/^c\d{1,4}$/.test(key) || keySet.has(key)) continue;
    keySet.add(key);
    const col = {
      key,
      label: capStr(c.label, LIMITS.label),
      type: c.type === "date" ? "date" : "text"
    };
    if (c.ovKey != null) col.ovKey = capStr(c.ovKey, LIMITS.label * 2);
    outCols.push(col);
  }
  const rows = Array.isArray(sh.rows) ? sh.rows.slice(0, LIMITS.rows) : [];
  const outRows = [];
  for (const r of rows){
    if (typeof r !== "object" || r === null) continue;
    const cells = (typeof r.c === "object" && r.c) || {};
    const out = {};
    let any = false;
    for (const k of keySet){
      if (cells[k] != null && cells[k] !== ""){
        out[k] = capStr(cells[k], LIMITS.cell);
        any = true;
      }
    }
    if (any) outRows.push({ c: out });
  }
  if (!outCols.length || !outRows.length) return null;
  return { name: capStr(sh.name, LIMITS.label) || "Tab", columns: outCols, rows: outRows };
}
function sanitizeState(o){
  if (typeof o !== "object" || o === null) throw new Error("not an object");
  const s = defaultState();
  const meta = (typeof o.meta === "object" && o.meta) || {};
  s.meta.fileName = capStr(meta.fileName, LIMITS.label);
  s.meta.importedAt = capStr(meta.importedAt, 40);

  let sheetsIn = [];
  if (Array.isArray(o.sheets)) sheetsIn = o.sheets.slice(0, LIMITS.sheets);
  else if (Array.isArray(o.columns) || Array.isArray(o.rows))
    sheetsIn = [{ name: "Import", columns: o.columns, rows: o.rows }];   // v1 migration
  s.sheets = [];
  for (const sh of sheetsIn){
    const clean = sanitizeSheet(sh);
    if (clean) s.sheets.push(clean);
  }
  s.active = coerceInt(o.active, 0, 0, Math.max(0, s.sheets.length - 1));

  const set = (typeof o.settings === "object" && o.settings) || {};
  s.settings.lang = set.lang === "en" ? "en" : "de";
  /* default recipients only when the field was never set — an intentionally
     cleared list (empty string) must stay cleared */
  s.settings.mailTo = set.mailTo == null ? DEFAULT_MAILTO : capStr(set.mailTo, 500);
  s.settings.lastVersion = capStr(set.lastVersion, 20);
  s.settings.critDays = coerceInt(set.critDays, 30, 0, 3650);
  s.settings.warnDays = coerceInt(set.warnDays, 90, 0, 3650);
  if (s.settings.warnDays <= s.settings.critDays) s.settings.warnDays = s.settings.critDays + 1;
  s.settings.columnOverrides = {};
  if (typeof set.columnOverrides === "object" && set.columnOverrides){
    let n = 0;
    for (const k in set.columnOverrides){
      if (n >= LIMITS.overrides) break;
      const v = set.columnOverrides[k];
      if (v === "date" || v === "text"){
        s.settings.columnOverrides[capStr(k, LIMITS.label)] = v;
        n++;
      }
    }
  }
  return s;
}

/* ---------- dates ---------- */
function todayParts(){
  const d = new Date();                       // always derived live — never hardcoded
  return { y: d.getFullYear(), m: d.getMonth()+1, d: d.getDate() };
}
function todayUTCms(){
  const p = todayParts();
  return Date.UTC(p.y, p.m-1, p.d);
}
function isoFromYMD(y, m, d){
  if (!(y >= 1900 && y <= 2200 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  const dt = new Date(Date.UTC(y, m-1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m-1 || dt.getUTCDate() !== d) return null;
  return dt.toISOString().slice(0,10);
}
/* Parse a stored cell string into ISO date (dd.mm.yyyy / dd-mm-yyyy / dd/mm/yyyy / yyyy-mm-dd). European day-first. */
function parseDateString(sRaw){
  if (sRaw == null) return null;
  const s = String(sRaw).trim();
  if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s].*)?$/);
  if (m) return isoFromYMD(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/);
  if (m){
    let y = +m[3];
    if (y < 100) y += (y >= 70 ? 1900 : 2000);
    return isoFromYMD(y, +m[2], +m[1]);
  }
  return null;
}
function fmtDate(iso){
  if (!iso) return "";
  const p = iso.split("-");
  const f = cachedFmt("d", { year:"numeric", month:"2-digit", day:"2-digit", timeZone:"UTC" });
  return f ? f.format(new Date(Date.UTC(+p[0], +p[1]-1, +p[2]))) : iso;
}
function todayISO(){
  const p = todayParts();
  return p.y + "-" + pad2(p.m) + "-" + pad2(p.d);
}
function fmtTodayLong(){
  const f = cachedFmt("long", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  return f ? f.format(new Date()) : todayISO();
}
function fmtNow(){
  const f = cachedFmt("now", { dateStyle:"medium", timeStyle:"short" });
  return f ? f.format(new Date()) : new Date().toLocaleString();
}
function daysUntil(iso){
  const p = iso.split("-");
  return Math.round((Date.UTC(+p[0], +p[1]-1, +p[2]) - todayUTCms()) / 86400000);
}
function statusForDays(days){
  if (days < 0) return "expired";
  if (days <= state.settings.critDays) return "critical";
  if (days <= state.settings.warnDays) return "warning";
  return "ok";
}
const ST_RANK = { expired: 0, critical: 1, warning: 2, ok: 3, none: 4 };
const ST_ICON = { expired: "⛔", critical: "🔴", warning: "⚠️", ok: "✅", none: "–" };
function stLabel(st){
  return { expired:t("stExpired"), critical:t("stCritical"), warning:t("stWarning"), ok:t("stOk"), none:t("stNone") }[st];
}
function chip(st){
  return '<span class="chip ' + st + '">' + ST_ICON[st] + " " + esc(stLabel(st)) + "</span>";
}

/* ---------- derived data ---------- */
function dateCols(){ return sheet().columns.filter(c => c.type === "date"); }
function textCols(){ return sheet().columns.filter(c => c.type === "text"); }
function nameColKeysFor(sh){
  const tc = sh.columns.filter(c => c.type === "text");
  const first = tc.find(c => /first\s*name|vorname/i.test(c.label));
  const last  = tc.find(c => /surname|last\s*name|nachname/i.test(c.label));
  if (first && last) return [first.key, last.key];
  const byName = tc.find(c => /name/i.test(c.label));
  return byName ? [byName.key] : (tc[0] ? [tc[0].key] : []);
}
function nameColKeys(){ return nameColKeysFor(sheet()); }
function rowNameFor(sh, row, i){
  const parts = nameColKeysFor(sh).map(k => String(row.c[k] || "").trim()).filter(Boolean);
  return parts.join(" ") || t("noNameCol", {i: i+1});
}
function rowName(row, i){ return rowNameFor(sheet(), row, i); }
/* "Aktiv" flag column of the active sheet (e.g. an 'x' marker) */
function aktivColKey(){
  const c = textCols().find(col => /(^|·\s*)aktiv$/i.test(col.label.trim()));
  return c ? c.key : null;
}
function isActiveRow(row, key){
  const k = key !== undefined ? key : aktivColKey();   // callers in loops pass the hoisted key
  return !k || !!(row.c[k] && String(row.c[k]).trim());
}
/* per-row evaluation: [{col, iso, days, status}] for date cols + overall worst status.
   Memoized per row object; bumpEval() invalidates when thresholds, column types,
   the reference day, or the loaded data change. */
let evalEpoch = 0;
function bumpEval(){ evalEpoch++; }
const evalCache = new WeakMap();
function evalRow(row){
  const hit = evalCache.get(row);
  if (hit && hit.e === evalEpoch) return hit.v;
  const items = [];
  let worst = "none";
  for (const col of dateCols()){
    const iso = parseDateString(row.c[col.key]);
    if (!iso) {
      if (row.c[col.key]) items.push({ col, iso: null, days: null, status: "none" });
      continue;
    }
    const days = daysUntil(iso);
    const st = statusForDays(days);
    items.push({ col, iso, days, status: st });
    if (ST_RANK[st] < ST_RANK[worst]) worst = st;
  }
  const v = { items, worst };
  evalCache.set(row, { e: evalEpoch, v });
  return v;
}

/* ---------- "hide long-expired" toggle ---------- */
/* ISO date exactly 6 months before today; a date entry that expired before this
   is considered "long expired" and can be hidden via the toggle. */
function longExpiredCutoffISO(){
  const p = todayParts();
  return new Date(Date.UTC(p.y, p.m - 1 - 6, p.d)).toISOString().slice(0, 10);
}
function isLongExpiredItem(it, cutoff){
  return !!(cutoff && it.iso && it.status === "expired" && it.iso < cutoff);
}
/* Effect of the toggle on a single row's evaluation.
   `hidden` counts entries older than 6 months (always, for the badge). When `on`,
   those entries are stripped from the returned eval and `drop` is true only when the
   person has NO other dated entry left — so anyone with a newer expiry stays visible. */
function applyHideLongExpired(ev, cutoff, on){
  let hidden = 0;
  const kept = [];
  for (const it of ev.items){
    if (isLongExpiredItem(it, cutoff)){ hidden++; if (on) continue; }
    kept.push(it);
  }
  if (!on || hidden === 0) return { ev, drop: false, hidden };
  if (!kept.length) return { ev, drop: true, hidden };
  let worst = "none";
  for (const it of kept) if (ST_RANK[it.status] < ST_RANK[worst]) worst = it.status;
  return { ev: { items: kept, worst }, drop: false, hidden };
}

/* ---------- Excel import ---------- */
function handleExcelFile(file){
  const reader = new FileReader();
  reader.onerror = () => toast(t("importErr", {e: "FileReader"}), "err");
  reader.onload = (ev) => {
    const bytes = new Uint8Array(ev.target.result);
    try {
      importWorkbook(bytes, file.name);
    } catch(e){
      console.error(e);
      if (/password/i.test(e && e.message ? e.message : "")){
        openPasswordModal(bytes, file.name);      // encrypted workbook → ask for the password
      } else {
        toast(t("importErr", {e: e && e.message ? e.message : e}), "err", 8000);
      }
    }
  };
  reader.readAsArrayBuffer(file);
}

/* decryption support for password-protected workbooks (self-hosted xlsx-populate,
   loaded lazily only when an encrypted file shows up; password is never stored) */
let xpLoading = null;
function loadXlsxPopulate(){
  if (window.XlsxPopulate) return Promise.resolve();
  if (xpLoading) return xpLoading;
  xpLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "vendor/xlsx-populate.min.js";
    s.onload = () => resolve();
    s.onerror = () => { xpLoading = null; reject(new Error("vendor/xlsx-populate.min.js")); };
    document.head.appendChild(s);
  });
  return xpLoading;
}
function openPasswordModal(bytes, fileName, onData){
  const handleDecrypted = onData || ((u8) => importWorkbook(u8, fileName));
  openModal({
    title: t("pwTitle"),
    bodyHTML: "<p>" + esc(t("pwBody")) + "</p>" +
      "<p><strong>" + esc(fileName) + "</strong></p>" +
      '<label for="pwInput">' + esc(t("pwLabel")) + "</label>" +
      '<input type="password" id="pwInput" autocomplete="off">' +
      '<div class="exp-count" id="pwStatus" aria-live="polite"></div>',
    buttons: [
      { label: t("cancel"), kind: "ghost", onClick: () => true },
      { label: t("pwOpen"), onClick: (back) => {
          const pw = back.querySelector("#pwInput").value;
          const status = back.querySelector("#pwStatus");
          status.textContent = t("pwWorking");
          let decrypted = false;
          loadXlsxPopulate()
            .then(() => window.XlsxPopulate.fromDataAsync(bytes.buffer, { password: pw }))
            .then(wb => wb.outputAsync("uint8array"))
            .then(u8 => {
              decrypted = true;
              closeModal();
              handleDecrypted(u8);
            })
            .catch(err => {
              console.error(err);
              if (decrypted){
                /* decryption succeeded — this is a parse error, not a wrong password */
                toast(t("importErr", {e: err && err.message ? err.message : err}), "err", 8000);
              } else {
                if (document.contains(status)) status.textContent = "";
                toast(t("pwWrong"), "err", 6000);
              }
            });
          return false;   // keep the modal open until decryption succeeds
      }}
    ]
  });
}
/* normalize a raw cell to a string / to an ISO date if it looks like one */
function cellToString(v){
  if (v == null) return "";
  if (v instanceof Date){
    const iso = isoFromYMD(v.getFullYear(), v.getMonth()+1, v.getDate());
    return iso || "";
  }
  if (typeof v === "number") return String(v);
  return capStr(String(v).trim(), LIMITS.cell);
}
function cellDateISO(v){
  if (v instanceof Date) return isoFromYMD(v.getFullYear(), v.getMonth()+1, v.getDate());
  /* plain numbers are NOT treated as date serials: with cellDates:true every
     date-formatted Excel cell arrives as a Date object, so a bare number is a
     real number (staff no., counter) — interpreting it as a serial corrupted data */
  if (typeof v === "string") return parseDateString(v);
  return null;
}
function headerText(v){
  return (v == null ? "" : String(v)).replace(/\s+/g, " ").trim();
}

function parseSheet(ws, sheetName){
  const grid = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
  if (!grid.length) return null;

  /* header row = row (within first 15) with the most non-empty string cells */
  let headerIdx = 0, best = -1;
  for (let i = 0; i < Math.min(grid.length, 15); i++){
    const row = grid[i] || [];
    let score = 0;
    for (const cell of row) if (typeof cell === "string" && cell.trim()) score++;
    if (score >= 2 && score > best){ best = score; headerIdx = i; }
  }
  const headerRow = grid[headerIdx] || [];
  const dataGrid = grid.slice(headerIdx + 1);

  const nCols = Math.min(LIMITS.cols,
    Math.max(headerRow.length, ...dataGrid.slice(0, 500).map(r => (r || []).length), 1));

  /* group row above the header (e.g. aircraft type over TRI/SFI/TRE columns):
     used when it has ≥2 labels or merged cells — expand merges, then forward-fill */
  let groups = null;
  if (headerIdx > 0){
    const gRow = (grid[headerIdx - 1] || []).map(headerText);
    const merges = (ws["!merges"] || []).filter(m => m.s.r === headerIdx - 1);
    const distinct = new Set(gRow.filter(Boolean));
    if (distinct.size >= 2 || merges.length){
      groups = [];
      for (let cIdx = 0; cIdx < nCols; cIdx++) groups.push(gRow[cIdx] || "");
      for (const m of merges){
        const v = groups[m.s.c] || "";
        for (let cIdx = m.s.c; cIdx <= Math.min(m.e.c, nCols - 1); cIdx++) groups[cIdx] = v;
      }
      for (let cIdx = 1; cIdx < nCols; cIdx++)
        if (!groups[cIdx]) groups[cIdx] = groups[cIdx - 1];   // "centered across" fallback
    }
  }

  /* column stats for type detection */
  const stats = [];
  for (let cIdx = 0; cIdx < nCols; cIdx++) stats.push({ nonEmpty: 0, dateLike: 0 });
  const rows = [];
  for (const r of dataGrid){
    if (rows.length >= LIMITS.rows) break;
    const src = r || [];
    let any = false;
    const cells = {};
    for (let cIdx = 0; cIdx < nCols; cIdx++){
      const v = src[cIdx];
      if (v == null || v === "" ) continue;
      const iso = cellDateISO(v);
      stats[cIdx].nonEmpty++;
      if (iso) stats[cIdx].dateLike++;
      cells["c"+cIdx] = iso || cellToString(v);
      if (cells["c"+cIdx] === "") delete cells["c"+cIdx]; else any = true;
    }
    if (any) rows.push({ c: cells });
  }
  if (!rows.length) return null;

  const overrides = state.settings.columnOverrides || {};
  /* group prefix only where needed: sub-headers that repeat (TRI, SFI, Rating IR …) */
  const subCount = {};
  for (let cIdx = 0; cIdx < nCols; cIdx++){
    const sub = headerText(headerRow[cIdx]);
    if (!sub) continue;
    subCount[sub] = (subCount[sub] || 0) + 1;
  }
  const columns = [];
  const usedLabels = new Set();
  const ovOcc = {};
  for (let cIdx = 0; cIdx < nCols; cIdx++){
    const sub = headerText(headerRow[cIdx]);
    const grp = groups ? groups[cIdx] : "";
    if (stats[cIdx].nonEmpty === 0 && !sub) continue;   // fully empty column
    const needsPrefix = sub && grp && grp !== sub && subCount[sub] > 1;
    const baseLabel = capStr(needsPrefix ? grp + " · " + sub
              : (sub || grp || (t("licCol") + " " + (cIdx+1))), LIMITS.label);
    let label = baseLabel;
    if (usedLabels.has(label)){                          // keep labels unique per sheet
      let n = 2;
      while (usedLabels.has(label + " (" + n + ")")) n++;
      label = label + " (" + n + ")";
    }
    usedLabels.add(label);
    /* stable override key: base label + occurrence index — survives the "(2)"
       display-dedup shifting when previously empty columns gain data */
    const occ = ovOcc[baseLabel] = (ovOcc[baseLabel] || 0) + 1;
    const ovKey = sheetName + "¦" + baseLabel + "¦" + occ;
    /* date column if clearly date-dominated (≥60%) OR mixed but with a solid
       date core (≥3 dates and ≥30%) — license columns often mix dates with
       remarks like "TKI" or "N/A" and must still be monitored */
    const ratio = stats[cIdx].nonEmpty > 0 ? stats[cIdx].dateLike / stats[cIdx].nonEmpty : 0;
    let type = (ratio >= 0.6 && stats[cIdx].dateLike >= 1) ||
               (stats[cIdx].dateLike >= 3 && ratio >= 0.3) ? "date" : "text";
    const ovr = overrides[ovKey] !== undefined ? overrides[ovKey]
              : overrides[sheetName + "¦" + label];       // legacy key fallback
    if (ovr === "date" || ovr === "text") type = ovr;
    columns.push({ key: "c"+cIdx, label, type, ovKey });
  }
  if (!columns.length) return null;
  return { name: capStr(sheetName, LIMITS.label), columns, rows };
}

function parseWorkbookBytes(bytes){
  const wb = XLSX.read(bytes, { type: "array", cellDates: true });
  const sheets = [];
  for (const name of wb.SheetNames){
    if (sheets.length >= LIMITS.sheets) break;
    const parsed = parseSheet(wb.Sheets[name], name);
    if (parsed) sheets.push(parsed);
  }
  return sheets;
}
function importWorkbook(bytes, fileName){
  const sheets = parseWorkbookBytes(bytes);
  if (!sheets.length){ toast(t("importEmpty"), "warn"); return; }

  state.meta.fileName = capStr(fileName, LIMITS.label);
  state.meta.importedAt = new Date().toISOString();
  state.sheets = sheets;
  state.active = 0;
  ui = defaultUI();
  currentView = "dash";
  saveState();
  render();
  const total = sheets.reduce((a, s) => a + s.rows.length, 0);

/* ---------- backup ---------- */
function downloadBackup(isAuto){
  const payload = {
    app: "instructor-license-dashboard",
    schemaVersion: 2,
    exportedAt: new Date().toISOString(),
    meta: state.meta, sheets: state.sheets, active: state.active, settings: state.settings
  };
  const now = new Date();
  const stamp = now.getFullYear() + pad2(now.getMonth()+1) + pad2(now.getDate()) + "-" + pad2(now.getHours()) + pad2(now.getMinutes());
  const name = "license-dashboard-backup-" + stamp + (isAuto ? "-auto" : "") + ".json";
  const blob = new Blob([JSON.stringify(payload, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  if (!isAuto) toast(t("backupDone"));
}
function handleBackupFile(file){
  if (file.size > LIMITS.backupBytes){
    toast(t("backupErr", {e: "> 15 MB"}), "err"); return;
  }
  const reader = new FileReader();
  reader.onerror = () => toast(t("backupErr", {e: "FileReader"}), "err");
  reader.onload = (ev) => {
    try {
      const obj = JSON.parse(ev.target.result);
      if (typeof obj !== "object" || obj === null || obj.app !== "instructor-license-dashboard")
        throw new Error("wrong app id");
      if (typeof obj.schemaVersion !== "number" || obj.schemaVersion > 2)
        throw new Error("schemaVersion " + obj.schemaVersion);
      const next = sanitizeState(obj);   // whitelist + coerce + cap — never trust raw JSON
      /* a backup may carry an old lastVersion — restoring is not an app update */
      next.settings.lastVersion = APP_VERSION;
      state = next;
      ui = defaultUI();
      currentView = "dash";
      saveState();
      applyStaticI18n();
      render();
      toast(t("backupRestored", { n: state.sheets.reduce((a, s) => a + s.rows.length, 0) }));
    } catch(e){
      console.error(e);
      toast(t("backupErr", {e: e && e.message ? e.message : e}), "err", 8000);
    }
  };
  reader.readAsText(file);
}

function exportBaseName(suffix){
  const tab = sheet().name.replace(/[^\wäöüÄÖÜß-]+/g, "_").slice(0, 40) || "export";

function downloadBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);

function exportXLSX(rows, suffix){
  const cols = sheet().columns;
  const aoa = [[t("colStatus")].concat(cols.map(c => c.label))];
  for (const { row, ev } of rows){
    const line = [stLabel(ev.worst)];
    for (const c of cols){
      const v = row.c[c.key] || "";
      if (c.type === "date"){
        const iso = parseDateString(v);
        if (iso){
          const p = iso.split("-");
          line.push(new Date(Date.UTC(+p[0], +p[1]-1, +p[2])));   // real date cell, not text
          continue;
        }
      }
      line.push(v);
    }
    aoa.push(line);
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true });
  ws["!cols"] = [{ wch: 12 }].concat(cols.map(c => ({ wch: Math.min(28, Math.max(11, c.label.length + 2)) })));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheet().name.replace(/[\\\/\?\*\[\]:]/g, " ").slice(0, 31) || "Export");
  const name = exportBaseName(suffix) + ".xlsx";
  const out = XLSX.write(wb, { type: "array", bookType: "xlsx", cellDates: true });
  downloadBlob(new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), name);
  toast(t("expDone", {f: name}));
}
function exportCSV(rows, suffix){
  const cols = sheet().columns;
  const lines = [[t("colStatus")].concat(cols.map(c => c.label)).map(csvEscape).join(";")];
  for (const { row, ev } of rows){
    const line = [stLabel(ev.worst)];
    for (const c of cols){
      const v = row.c[c.key] || "";
      const iso = c.type === "date" ? parseDateString(v) : null;
      line.push(iso ? fmtDate(iso) : v);
    }
    lines.push(line.map(csvEscape).join(";"));
  }
  const name = exportBaseName(suffix) + ".csv";
  downloadCSV(lines, name);
  toast(t("expDone", {f: name}));
}
function exportPDF(rows, statusSet, suffix){
  const doc = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });

  const { items, perLic } = collectItems(rows, wanted);

  const colX = [M, M+30, M+95, M+170, M+200];         // Status | Name | Lizenz | Datum | Hinweis
  const colW = [28, 63, 73, 28, W-M-(M+200)];
  const headerH = 8, rowH = 6.5;
  let y = 0;

  function pageHeader(){
    doc.setFillColor(23, 63, 119);                     // --bl-dark

    y += 7;
    tableHead();
  }
  function tableHead(){
    doc.setFillColor(33, 96, 174);                     // --bl
    doc.rect(M, y, W - 2*M, headerH, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold"); doc.setFontSize(9);
    const labels = [t("colStatus"), t("person"), t("pdfLic"), t("pdfDate"), t("pdfDays")];
    labels.forEach((l, i) => doc.text(l, colX[i] + 2, y + 5.5));
    y += headerH;
    doc.setFont("helvetica", "normal");
    doc.setTextColor(30, 40, 60);
  }
  function pageFooter(){
    doc.setFontSize(8);
    doc.setTextColor(120, 130, 145);
    doc.text(COPYRIGHT + "  ·  Version " + APP_VERSION, M, H - 7);
    doc.setTextColor(30, 40, 60);
  }
  const ST_PDF = {
    expired:  { label: () => stLabel("expired"),  rgb: [208, 59, 59]  },
    critical: { label: () => stLabel("critical"), rgb: [236, 131, 90] },
    warning:  { label: () => stLabel("warning"),  rgb: [178, 125, 12] },
    ok:       { label: () => stLabel("ok"),       rgb: [8, 97, 8]     }
  };
  pageHeader();
  if (!items.length){
    doc.setFontSize(11);
    doc.text(t("pdfNoWarn"), M, y + 8);
  }
  let alt = false;
  for (const it of items){
    if (y + rowH > H - 14){
      pageFooter();
      doc.addPage();
      y = 0;
      pageHeader();
      alt = false;
    }
    if (alt){
      doc.setFillColor(240, 245, 251);
      doc.rect(M, y, W - 2*M, rowH, "F");
    }
    alt = !alt;
    const st = ST_PDF[it.status];
    doc.setTextColor(st.rgb[0], st.rgb[1], st.rgb[2]);
    doc.setFont("helvetica", "bold");
    doc.text(st.label(), colX[0] + 2, y + 4.7);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(30, 40, 60);
    doc.setFontSize(9);
    doc.text(String(it.name).slice(0, 40), colX[1] + 2, y + 4.7);
    doc.text(String(it.lic).slice(0, 48), colX[2] + 2, y + 4.7);
    doc.text(fmtDate(it.iso), colX[3] + 2, y + 4.7);
    doc.text(daysText(it.days).slice(0, 34), colX[4] + 2, y + 4.7);
    y += rowH;
  }
  pageFooter();
  const total = doc.getNumberOfPages();
  for (let i = 1; i <= total; i++){
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(120, 130, 145);
    doc.text(t("pdfPage", {a: i, b: total}), W - M, H - 7, { align: "right" });

  doc.save(name);
  toast(t("expDone", {f: name}));
}

/* iCal export: one all-day event per expiry date with 30/7-day reminders */
function icsEscape(s){
  return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
}
function icsFold(line){
  /* RFC 5545: physical lines ≤ 75 OCTETS (UTF-8), folds must not split a
     code point — count bytes per code point and break before the limit */
  const out = [];
  let cur = "", bytes = 0;
  for (const ch of line){                       // for..of iterates code points
    const cp = ch.codePointAt(0);
    const b = cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
    if (bytes + b > 74){ out.push(cur); cur = " " + ch; bytes = 1 + b; }
    else { cur += ch; bytes += b; }
  }
  out.push(cur);
  return out.join("\r\n");
}
function exportICS(rows, statusSet, suffix){
  const wanted = (statusSet && statusSet.length) ? statusSet : ["expired", "critical", "warning", "ok"];
  const { items } = collectItems(rows, wanted);
  if (!items.length){ toast(t("expNoRows"), "warn"); return; }
  const now = new Date();
  const dtstamp = now.getUTCFullYear() + pad2(now.getUTCMonth()+1) + pad2(now.getUTCDate()) +
    "T" + pad2(now.getUTCHours()) + pad2(now.getUTCMinutes()) + pad2(now.getUTCSeconds()) + "Z";
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0",
    "PRODID:-//Instructor License Dashboard//" + APP_VERSION + "//DE",
    "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "X-WR-CALNAME:" + icsEscape(t("icsCalName") + " · " + sheet().name)
  ];
  let uidN = 0;
  for (const it of items){
    const d0 = it.iso.replace(/-/g, "");
    const p = it.iso.split("-");
    const next = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]) + 86400000);
    const d1 = next.getUTCFullYear() + pad2(next.getUTCMonth()+1) + pad2(next.getUTCDate());
    const summary = t("icsSummary", {n: it.name, l: it.lic});
    lines.push("BEGIN:VEVENT",
      "UID:ilc-" + d0 + "-" + (++uidN) + "-" + dtstamp + "@license-dashboard",
      "DTSTAMP:" + dtstamp,
      "DTSTART;VALUE=DATE:" + d0,
      "DTEND;VALUE=DATE:" + d1,
      icsFold("SUMMARY:" + icsEscape("⚠ " + summary)),
      icsFold("DESCRIPTION:" + icsEscape(summary + " (" + stLabel(it.status) + ")\n" + COPYRIGHT)),
      "TRANSP:TRANSPARENT",
      "BEGIN:VALARM", "ACTION:DISPLAY", icsFold("DESCRIPTION:" + icsEscape(summary)), "TRIGGER:-P30D", "END:VALARM",
      "BEGIN:VALARM", "ACTION:DISPLAY", icsFold("DESCRIPTION:" + icsEscape(summary)), "TRIGGER:-P7D", "END:VALARM",
      "END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  const name = exportBaseName(suffix) + ".ics";
  downloadBlob(new Blob([lines.join("\r\n") + "\r\n"], { type: "text/calendar;charset=utf-8" }), name);
  toast(t("expDone", {f: name}));
}

      const run = (fn, itemBased) => {

/* ---------- email report (mailto — no server, no storage) ---------- */
function mailItems(statusSet, rowsOverride){
  const wanted = (statusSet && statusSet.length) ? statusSet : ["expired", "critical", "warning"];
  /* filter at ITEM level only — a person whose worst status is outside the set
     must still contribute their matching licenses */
  return collectItems(rowsOverride || filteredRows([]), wanted);
}
function mailLine(it){
  return "- [" + stLabel(it.status) + "] " + fmtDate(it.iso) + " | " + it.name + " | " + it.lic + " (" + daysText(it.days) + ")";
}
function mailText(statusSet, maxChars, rowsOverride){
  const { items, perLic } = mailItems(statusSet, rowsOverride);
  let text = t("mailHead", {
    s: sheet().name, d: fmtTodayLong(),
    sum: t("pdfSummary", {e: perLic.expired, c: perLic.critical, w: perLic.warning, o: perLic.ok})
  }) + "\n";
  let used = 0;
  for (let i = 0; i < items.length; i++){
    const line = mailLine(items[i]) + "\n";
    if (maxChars && text.length + line.length > maxChars){
      text += t("mailTruncated", {n: items.length - used}) + "\n";
      break;
    }
    text += line;
    used++;
  }
  if (!items.length) text += t("pdfNoWarn") + "\n";
  text += "\n" + COPYRIGHT + " · Version " + APP_VERSION + "\n";
  return text;
}
function buildMailto(to, statusSet, rowsOverride){
  const subject = t("mailSubject", {s: sheet().name, d: fmtTodayLong()});
  /* put the COMPLETE selected list into the draft (no truncation); some mail clients
     have their own mailto length limits, in which case the Copy button is the fallback */
  const body = mailText(statusSet, 0, rowsOverride);
  /* RFC 6068: multiple addresses are comma-separated and must not have their
     separators percent-encoded — encode each address individually */
  const addrs = String(to || "").split(/[;,]/).map(a => a.trim()).filter(Boolean)
    .map(a => encodeURIComponent(a)).join(",");
  return "mailto:" + addrs +
    "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}
function copyToClipboard(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(() => true).catch(() => legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  let done = false;
  try { done = document.execCommand("copy"); } catch(e){ console.error(e); }
  ta.remove();
  return done;
}

        link.setAttribute("aria-disabled", String(!set.length));

      };
      link.addEventListener("click", (e) => {
        /* nothing selected → block instead of silently mailing the default report */
        if (!readSet().length){ e.preventDefault(); toast(t("expNoRows"), "warn"); return; }
        remember();
      });
      back.querySelector("#mailCopyBtn").addEventListener("click", () => {

        });

/* ---------- toast ---------- */
function toast(msg, kind, ms, action){
  const host = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast" + (kind === "err" ? " err" : kind === "warn" ? " warn" : "");
  const span = document.createElement("span");
  span.textContent = msg;
  el.appendChild(span);
  if (action){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "t-act";
    b.textContent = action.label;
    b.addEventListener("click", () => { el.remove(); action.fn(); });
    el.appendChild(b);
  }
  host.appendChild(el);
  setTimeout(() => el.remove(), ms || (action ? 8000 : 4500));
}

/* ---------- modal (focus trap, Esc, focus return; no native confirm/prompt) ---------- */
let modalPrevFocus = null;
function openModal({ title, bodyHTML, buttons, onOpen }){
  closeModal();
  modalPrevFocus = document.activeElement;
  const host = document.getElementById("modalHost");
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">' +
      "<header><h2 id='mTitle'>" + esc(title) + "</h2>" +
      '<button class="x" type="button" aria-label="' + esc(t("close")) + '">✕</button></header>' +
      '<div class="m-body">' + bodyHTML + "</div>" +
      '<div class="m-foot"></div>' +
    "</div>";
  host.appendChild(back);
  const foot = back.querySelector(".m-foot");
  for (const b of (buttons || [])){
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn" + (b.kind ? " " + b.kind : "");
    btn.textContent = b.label;
    btn.addEventListener("click", () => { if (b.onClick(back) !== false) closeModal(); });
    foot.appendChild(btn);
  }
  back.querySelector(".x").addEventListener("click", closeModal);
  back.addEventListener("mousedown", (e) => { if (e.target === back) closeModal(); });
  back.addEventListener("keydown", (e) => {
    if (e.key === "Escape"){ e.preventDefault(); closeModal(); }
    if (e.key === "Tab"){
      const f = back.querySelectorAll("button,input,select,textarea,a[href],[tabindex]");
      if (!f.length) return;
      const first = f[0], last = f[f.length-1];
      if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });
  const firstInput = back.querySelector(".m-body input, .m-body select") || back.querySelector(".m-foot button") || back.querySelector(".x");
  if (firstInput) firstInput.focus();
  if (onOpen) onOpen(back);
}

function filteredRows(statusOverride){
  const q = ui.q.trim().toLowerCase();
  const statuses = statusOverride !== undefined ? statusOverride : ui.statuses;
  const aKey = ui.activeOnly ? aktivColKey() : null;
  const cutoff = longExpiredCutoffISO();
  const out = [];
  sheet().rows.forEach((row, idx) => {
    if (ui.activeOnly && !isActiveRow(row, aKey)) return;
    const { ev, drop } = applyHideLongExpired(evalRow(row), cutoff, ui.hideLongExpired);
    if (drop) return;                                  // every expiry is > 6 months old → hide the person
    if (statuses.length && !statuses.includes(ev.worst)) return;
    for (const k in ui.colFilters){
      const want = ui.colFilters[k];
      if (!want) continue;
      const val = String(row.c[k] || "");
      if (want === "__empty__"){ if (val !== "") return; }
      else if (val !== want) return;
    }
    if (q){
      let hit = false;
      for (const c of sheet().columns){
        const v = row.c[c.key];
        if (v && String(v).toLowerCase().includes(q)){ hit = true; break; }
      }
      if (!hit && stLabel(ev.worst).toLowerCase().includes(q)) hit = true;
      if (!hit) return;
    }
    out.push({ row, idx, ev });
  });
  /* sort — precompute per-row keys so the comparator does no parsing (O(n) not O(n log n)) */
  const key = ui.sortKey, dir = ui.sortDir;
  const isDateCol = sheet().columns.some(c => c.key === key && c.type === "date");
  const sortKeys = new Map();
  if (key === "__status"){
    for (const e of out)
      sortKeys.set(e, e.ev.items.reduce((min, i) => i.iso && i.iso < min ? i.iso : min, "9999"));
  } else if (isDateCol){
    for (const e of out) sortKeys.set(e, parseDateString(e.row.c[key]) || "9999-99-99");
  }
  out.sort((a, b) => {
    let r = 0;
    if (key === "__status"){
      r = ST_RANK[a.ev.worst] - ST_RANK[b.ev.worst];
      if (r === 0){
        const ad = sortKeys.get(a), bd = sortKeys.get(b);
        r = ad < bd ? -1 : ad > bd ? 1 : 0;
      }
    } else if (isDateCol){
      const ai = sortKeys.get(a), bi = sortKeys.get(b);
      r = ai < bi ? -1 : ai > bi ? 1 : 0;
    } else {
      r = String(a.row.c[key] || "").localeCompare(String(b.row.c[key] || ""), undefined, { sensitivity: "base", numeric: true });
    }
    return r * dir;
  });
  return out;
}

function render(){
  if (renderedDay && renderedDay !== todayISO()) bumpEval();   // new reference day → re-evaluate all statuses
  renderedDay = todayISO();
  const main = document.getElementById("main");
  if (!state.sheets.length || currentView === "upload"){
    main.innerHTML = renderUpload();
    wireUpload();
    renderFooter();
    return;
  }
  const sh = sheet();

  /* ---- compute KPI + warning data in one pass (active sheet) ---- */
  let totalLic = 0, personCount = 0, activeCount = 0;
  const counts = { expired: 0, critical: 0, warning: 0, ok: 0, none: 0 };
  const perLic = { expired: 0, critical: 0, warning: 0, ok: 0 };
  const warnings = [];
  const warnColKeys = new Set();
  const aKey = aktivColKey();
  const cutoff6 = longExpiredCutoffISO();
  let longExpiredCount = 0;                            // date entries older than 6 months (for the toggle badge)
  sh.rows.forEach((row, idx) => {
    const active = isActiveRow(row, aKey);
    if (ui.activeOnly && !active) return;
    const res = applyHideLongExpired(evalRow(row), cutoff6, ui.hideLongExpired);
    longExpiredCount += res.hidden;
    if (res.drop) return;                              // person's every expiry is > 6 months old → hide
    const ev = res.ev;
    if (active) activeCount++;
    personCount++;
    counts[ev.worst]++;
    for (const it of ev.items){
      if (!it.iso) continue;
      totalLic++;
      perLic[it.status]++;
      if (it.status !== "ok"){
        warnColKeys.add(it.col.key);
        warnings.push({ name: rowName(row, idx), col: it.col.label, iso: it.iso, days: it.days, status: it.status });
      }
    }
  });
  warnings.sort((a, b) => a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : 0);

  /* quick filter also applies to the alert list */
  const visWarnings = ui.statuses.length ? warnings.filter(w => ui.statuses.includes(w.status)) : warnings;
  const WARN_CAP = 300;
  const shownWarnings = visWarnings.slice(0, WARN_CAP);

  /* compact mode: name/flag columns + only date columns that carry a warning */
  const nameKeys = new Set(nameColKeys());
  let visCols = sh.columns;
  if (ui.compact){
    visCols = sh.columns.filter(c =>
      nameKeys.has(c.key) ||
      c.key === aKey ||                                   // same Aktiv detection as the toggle
      (c.type === "date" && warnColKeys.has(c.key)));
    if (!visCols.length) visCols = sh.columns;
  }

  let html = "";
  /* sheet tabs */
  if (state.sheets.length > 1){
    html += '<div class="sheet-tabs" role="tablist">';
    state.sheets.forEach((s, i) => {
      html += '<button type="button" class="sheet-tab' + (i === state.active ? " active" : "") +
        '" role="tab" aria-selected="' + (i === state.active) + '" data-sheet="' + i + '">' +
        esc(s.name) + '<span class="n">' + esc(t("tabRows", {n: s.rows.length})) + "</span></button>";
    });
    html += "</div>";
  }

  /* reference date — always derived live from the system clock */
  html += '<div class="refdate" id="refdate">📅 <span class="rd-label">' + esc(t("refDate")) + ":</span>" +
    '<span class="rd-date">' + esc(fmtTodayLong()) + "</span>" +
    '<span class="rd-sub">' + esc(t("refDateSub")) + "</span></div>";

  /* KPI tiles */
  html += '<div class="kpis">' +
    kpiTile("accent", null, t("kPersons"), personCount, t("kFileSub")) +
    kpiTile("accent", null, t("kLicenses"), totalLic, t("kFileSub")) +
    kpiTile("clickable", "expired",  t("kExpired"),  perLic.expired,  ST_ICON.expired) +
    kpiTile("clickable", "critical", t("kCritical"), perLic.critical, ST_ICON.critical + " " + t("kDays", {d: state.settings.critDays})) +
    kpiTile("clickable", "warning",  t("kWarning"),  perLic.warning,  ST_ICON.warning + " " + t("kDays", {d: state.settings.warnDays})) +
    kpiTile("clickable", "ok",       t("kOk"),       perLic.ok,       ST_ICON.ok + " " + t("kOkSub", {d: state.settings.warnDays})) +
  "</div>";

  /* status quick-filter bar — chips filter table ROWS by worst status, so they
     show PERSON counts (the KPI tiles show license-entry counts, a different unit) */
  const chipDefs = [
    ["expired",  counts.expired], ["critical", counts.critical],
    ["warning",  counts.warning], ["ok", counts.ok], ["none", counts.none]
  ];
  html += '<div class="statusbar" role="group" aria-label="' + esc(t("sbLabel")) + '" title="' + esc(t("sbHint")) + '">' +
    '<span class="sb-label">' + esc(t("sbLabel")) + ":</span>" +
    (aktivColKey()
      ? '<button type="button" class="sb-active" id="sbActive" aria-pressed="' + ui.activeOnly + '">👤 ' +
        esc(t("activeOnly")) + '<span class="cnt">' + activeCount + "</span></button>"
      : "") +
    (longExpiredCount || ui.hideLongExpired
      ? '<button type="button" class="sb-active sb-hideold" id="sbHideOld" aria-pressed="' + ui.hideLongExpired +
        '" title="' + esc(t("hideOldTip")) + '">🕒 ' + esc(t("hideOld")) +
        '<span class="cnt">' + longExpiredCount + "</span></button>"
      : "") +
    chipDefs.map(([st, n]) =>
      '<button type="button" class="stchip" data-st="' + st + '" aria-pressed="' + ui.statuses.includes(st) + '">' +
      ST_ICON[st] + " " + esc(stLabel(st)) + '<span class="cnt">' + n + "</span></button>").join("") +
    "</div>";

  /* warnings card */
  html += '<div class="card"><h3><span class="dot"></span>' + esc(t("warnTitle")) + "</h3>";
  if (!visWarnings.length){
    html += '<div class="warn-empty">✅ ' + esc(t("warnNone")) + "</div>";
  } else {
    html += '<ul class="warn-list">';
    for (const w of shownWarnings){
      const daysTxt = daysText(w.days);
      html += "<li>" + chip(w.status) +
        '<span class="w-name">' + esc(w.name) + "</span>" +
        '<span class="w-lic">' + esc(w.col) + "</span>" +
        '<span class="w-date">' + esc(fmtDate(w.iso)) + "</span>" +
        '<span class="w-days">' + esc(daysTxt) + "</span></li>";
    }
    html += "</ul>";
    if (visWarnings.length > WARN_CAP)
      html += '<div class="warn-more">' + esc(t("warnMore", {n: visWarnings.length - WARN_CAP})) + "</div>";
  }
  html += "</div>";

  /* month calendar */
  if (!ui.calMonth) ui.calMonth = todayISO().slice(0, 7);
  html += renderCalendar(calItemsByDay());

  /* table card with filters */
  const rows = filteredRows();
  /* sticky lead columns: delete + status + name column(s) stay visible while scrolling */
  const stickyLeft = { "__del": 0, "__status": 34 };
  let leftAcc = 34 + 118;
  for (const k of nameColKeys()){
    if (visCols.some(c => c.key === k)){ stickyLeft[k] = leftAcc; leftAcc += 140; }
  }
  const stickStyle = (key, isName) => stickyLeft[key] !== undefined
    ? ' style="left:' + stickyLeft[key] + "px;" + (key === "__status" ? "min-width:118px;max-width:118px;"
        : isName ? "min-width:140px;max-width:140px;" : "") + '"'
    : "";
  html += '<div class="card"><h3><span class="dot"></span>' + esc(t("tblTitle")) + "</h3>";
  html += '<div class="table-wrap"><table class="data" id="dataTable"><thead><tr>';
  html += '<th class="delcell stick" scope="col" style="left:0"><span class="sr-only">' + esc(t("delRow")) + "</span></th>";
  html += thCell("__status", t("colStatus"), stickStyle("__status"));
  for (const c of visCols) html += thCell(c.key, c.label, stickStyle(c.key, true));
  html += "</tr></thead><tbody>";
  if (!rows.length){
    html += '<tr><td colspan="' + (visCols.length + 2) + '" class="no-rows">' + esc(t("noRows")) + "</td></tr>";
  } else {
    const nameKeySet = new Set(nameColKeys());
    for (const { row, idx, ev } of rows){
      html += '<tr><td class="delcell stick" style="left:0"><button type="button" class="rowdel" data-del="' + idx +
        '" title="' + esc(t("delRow")) + '" aria-label="' + esc(t("delRow")) + '">🗑</button></td>' +
        '<td class="stick"' + stickStyle("__status") + ">" + chip(ev.worst) + "</td>";
      for (const c of visCols){
        const v = row.c[c.key] || "";
        if (nameKeySet.has(c.key)){
          /* name cell: sticky + click opens the person detail view; title shows truncated names in full */
          html += '<td class="stick" title="' + esc(v) + '"' + stickStyle(c.key, true) + ">" +
            (v ? '<button type="button" class="plink" data-person="' + idx + '">' + esc(v) + "</button>" : "") + "</td>";
          continue;
        }
        if (c.type === "date"){
          const iso = parseDateString(v);
          if (iso){
            const st = statusForDays(daysUntil(iso));
            if (ui.hideLongExpired && st === "expired" && iso < cutoff6){
              /* long-expired entry hidden by the toggle — keep the cell but suppress the date */
              html += '<td class="date-cell date-old" title="' + esc(t("hideOldCellTip")) + '"><span class="d-old">⋯</span></td>';
            } else {
              html += '<td class="date-cell"><span class="d">' + esc(fmtDate(iso)) + "</span>" + chip(st) + "</td>";
            }
          } else if (v && isDateLike(v)){
            /* looks like a date but is not a real calendar day (e.g. 31.02.2024) — flag it */
            html += '<td class="date-cell"><span class="d">' + esc(v) + '</span><span class="chip none">⚠ ' + esc(t("stInvalid")) + "</span></td>";
          } else {
            html += '<td class="date-cell">' + esc(v) + "</td>";
          }
        } else {
          html += "<td>" + esc(v) + "</td>";
        }
      }
      html += "</tr>";
    }
  }
  html += "</tbody></table></div></div>";
  main.innerHTML = html;
  wireDashboard();
  renderFooter();
}

/* ---------- month calendar (expired & critical on their expiry dates) ---------- */
function calItemsByDay(){
  const byDay = new Map();
  for (const it of collectItems(filteredRows([]), ["expired", "critical"]).items){
    if (!byDay.has(it.iso)) byDay.set(it.iso, []);
    byDay.get(it.iso).push(it);
  }
  return byDay;
}
function renderCalendar(byDay){
  const ym = ui.calMonth;
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7);
  const monthFmt = cachedFmt("cal", { month: "long", year: "numeric", timeZone: "UTC" });
  const label = monthFmt ? monthFmt.format(new Date(Date.UTC(y, m-1, 1))) : ym;
  const firstDow = (new Date(Date.UTC(y, m-1, 1)).getUTCDay() + 6) % 7;   // Monday = 0
  const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const wdFmt = cachedFmt("wd", { weekday: "short", timeZone: "UTC" });
  let cells = "";
  for (let i = 0; i < 7; i++){
    const wd = wdFmt ? wdFmt.format(new Date(Date.UTC(2024, 0, 1 + i))) : String(i);  // 2024-01-01 is a Monday
    cells += '<div class="cal-wd">' + esc(wd) + "</div>";
  }
  for (let i = 0; i < firstDow; i++) cells += '<div class="cal-day empty"></div>';
  const tISO = todayISO();
  for (let d = 1; d <= dim; d++){
    const iso = ym + "-" + pad2(d);
    const entries = byDay.get(iso);
    const cls = "cal-day" + (iso === tISO ? " today" : "") + (entries ? " has" : "");
    if (!entries){
      cells += '<div class="' + cls + '"><span class="dnum">' + d + "</span></div>";
      continue;
    }
    /* show the affected names (not just a count) — expired first, then critical */
    const ordered = entries.slice().sort((a, b) => ST_RANK[a.status] - ST_RANK[b.status]);
    const NAME_CAP = 4;
    const names = ordered.slice(0, NAME_CAP).map(e =>
      '<span class="cal-name ' + e.status + '" title="' + esc(e.name + " — " + e.lic + " (" + fmtDate(e.iso) + ")") + '">' +
      esc(e.name) + "</span>").join("");
    const rest = ordered.length - Math.min(ordered.length, NAME_CAP);
    cells += '<button type="button" class="' + cls + '" data-calday="' + iso + '" aria-label="' +
      esc(t("calDayEntries", {d: fmtDate(iso)})) + '"><span class="dnum">' + d + "</span>" +
      '<div class="cal-names">' + names +
      (rest > 0 ? '<span class="cal-more">+' + rest + "</span>" : "") +
      "</div></button>";
  }
  return '<div class="card cal-card"><h3><span class="dot"></span>' + esc(t("calTitle")) + "</h3>" +
    '<div class="cal-head">' +
      '<button class="btn ghost" id="calPrev" type="button" aria-label="' + esc(t("calPrev")) + '">‹</button>' +
      '<span class="cal-month">' + esc(label) + "</span>" +
      '<button class="btn ghost" id="calNext" type="button" aria-label="' + esc(t("calNext")) + '">›</button>' +
      '<button class="btn ghost" id="calToday" type="button">' + esc(t("calToday")) + "</button>" +
      '<span class="spacer"></span>' +
      '<button class="btn" id="calIcs" type="button">📅 ' + esc(t("calIcs")) + "</button>" +
    "</div>" +
    '<div class="cal-grid">' + cells + "</div></div>";
}

/* ---------- wiring ---------- */
function wireUpload(){
  const dz = document.getElementById("dropzone");
  document.getElementById("dzPick").addEventListener("click", (e) => { e.stopPropagation(); document.getElementById("fileInput").click(); });
  document.getElementById("dzRestore").addEventListener("click", (e) => { e.stopPropagation(); document.getElementById("backupInput").click(); });
  dz.addEventListener("click", () => document.getElementById("fileInput").click());
  ["dragenter","dragover"].forEach(evName => dz.addEventListener(evName, (e) => {
    e.preventDefault(); dz.classList.add("drag");
  }));
  ["dragleave","drop"].forEach(evName => dz.addEventListener(evName, (e) => {
    e.preventDefault(); dz.classList.remove("drag");
  }));
  dz.addEventListener("drop", (e) => {
    e.stopPropagation();                          // the window-level handler must not process it again
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    if (/\.json$/i.test(f.name)) handleBackupFile(f);
    else handleExcelFile(f);
  });
  const back = document.getElementById("upBack");
  if (back) back.addEventListener("click", () => { currentView = "dash"; render(); });
}
function wireDashboard(){
  document.querySelectorAll(".stchip").forEach(chipBtn => {
    chipBtn.addEventListener("click", () => {
      toggleStatus(chipBtn.getAttribute("data-st"));
      render();
    });
  });
  const sbActive = document.getElementById("sbActive");
  if (sbActive) sbActive.addEventListener("click", () => {
    ui.activeOnly = !ui.activeOnly;
    render();
  });
  const sbHideOld = document.getElementById("sbHideOld");
  if (sbHideOld) sbHideOld.addEventListener("click", () => {
    ui.hideLongExpired = !ui.hideLongExpired;
    render();
  });
  document.querySelectorAll(".plink").forEach(pl => {
    pl.addEventListener("click", () => openPerson(parseInt(pl.getAttribute("data-person"), 10)));
  });
  /* month calendar */
  const refocus = (id) => {           // render() rebuilds #main — keep keyboard focus on the button
    const el = document.getElementById(id);
    if (el) el.focus();
  };
  const shiftMonth = (delta, focusId) => {
    const y = +ui.calMonth.slice(0, 4), m = +ui.calMonth.slice(5, 7) - 1 + delta;
    const d = new Date(Date.UTC(y, m, 1));
    ui.calMonth = d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1);
    render();
    refocus(focusId);
  };
  const calPrev = document.getElementById("calPrev");
  if (calPrev){
    calPrev.addEventListener("click", () => shiftMonth(-1, "calPrev"));
    document.getElementById("calNext").addEventListener("click", () => shiftMonth(1, "calNext"));
    document.getElementById("calToday").addEventListener("click", () => {
      ui.calMonth = todayISO().slice(0, 7);
      render();
      refocus("calToday");
    });
    document.getElementById("calIcs").addEventListener("click", () => {
      const rows = filteredRows([]);
      if (!rows.length){ toast(t("expNoRows"), "warn"); return; }
      exportICS(rows, ["expired", "critical"], "kalender");
    });
    document.querySelectorAll("[data-calday]").forEach(cd => {
      cd.addEventListener("click", () => openCalDay(cd.getAttribute("data-calday")));
    });
  }
  document.querySelectorAll(".sheet-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      const i = parseInt(tab.getAttribute("data-sheet"), 10);

              });

          }}

      });

function openPerson(idx){
  const sh = sheet();
  const row = sh.rows[idx];
  if (!row) return;
  const ev = evalRow(row);
  const nameKeySet = new Set(nameColKeys());
  const items = ev.items.filter(i => i.iso).sort((a, b) => a.iso < b.iso ? -1 : 1);

  /* Personal Details first, in a fixed order (missing fields show a dash) */
  const PERSONAL_PATTERNS = [
    /first\s*name|vorname/i, /surname|last\s*name|nachname/i, /pilot\s*lic/i,
    /mail\s*aaa/i, /mail\s*priv/i, /telephone|telefon/i, /adresse|address/i, /home\s*base/i
  ];
  const usedKeys = new Set();
  let personal = "";
  for (const re of PERSONAL_PATTERNS){
    /* text columns only — a date column like "Pilot Lic valid until" belongs to the license list */
    const col = sh.columns.find(c => c.type === "text" && re.test(c.label) && !usedKeys.has(c.key));

  }

  let body = "<p>" + chip(ev.worst) + "</p>" +
    (personal ? "<h4>" + esc(t("personDetails")) + '</h4><div class="pd-other">' + personal + "</div>" : "") +
    "<h4>" + esc(t("personLicenses")) + "</h4>";
  if (!items.length){

    other += "<div><b>" + esc(c.label) + ":</b>" + esc(v) + invalid + "</div>";
  }
  if (other) body += "<h4>" + esc(t("personOther")) + '</h4><div class="pd-other">' + other + "</div>";

  /* per-person export: same formats as the list export, scoped to this one person */
  const personRows = [{ row, idx, ev }];

    '<div style="display:flex;flex-wrap:wrap;gap:8px">' +

    "</div>";

  openModal({
    title: name,
    bodyHTML: body,
    buttons: [{ label: t("close"), kind: "ghost", onClick: () => true }],
    onOpen: (back) => {
      back.querySelector("#pdPdf").addEventListener("click", () => exportPDF(personRows, ALL_ST, name));

/* ---------- data quality report ---------- */
function dataQualityIssues(){
  const issues = [];
  for (const sh of state.sheets){
    const dCols = sh.columns.filter(c => c.type === "date");
    const nk = nameColKeysFor(sh);
    const seen = new Map();
    sh.rows.forEach((row, i) => {
      const nm = nk.map(k => String(row.c[k] || "").trim()).filter(Boolean).join(" ");
      if (!nm){
        issues.push({ type: "noname", tab: sh.name, person: t("noNameCol", {i: i+1}), col: "", value: "" });
      } else {
        const key = nm.toLowerCase().replace(/\s+/g, " ");
        if (!seen.has(key)) seen.set(key, 0);
        seen.set(key, seen.get(key) + 1);
      }
      for (const c of dCols){
        const v = row.c[c.key];
        if (!v) continue;
        const s = String(v).trim();
        if (!parseDateString(s) && isDateLike(s))
          issues.push({ type: "invalid", tab: sh.name, person: nm || t("noNameCol", {i: i+1}), col: c.label, value: s });
      }
    });
    for (const [key, n] of seen){
      if (n > 1) issues.push({ type: "dup", tab: sh.name, person: key, col: "", value: n + "×" });
    }
  }
  return issues;
}

  if (!state.sheets.length){ toast(t("printHint"), "warn"); return; }
